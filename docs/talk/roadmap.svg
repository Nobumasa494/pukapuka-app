<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" font-family="Noto Sans CJK JP, sans-serif">
<rect width="1000" height="900" fill="#fbf8f2"/>
<text x="500" y="44" text-anchor="middle" font-size="27" fill="#223">pukapuka　これからの流れ（2026-10-11）</text>
<g font-size="19" fill="#334">
<rect x="40" y="70" width="920" height="180" rx="18" fill="#eaf5ec"/>
<text x="64" y="106" font-size="23" fill="#2a7">✅ できたこと</text>
<text x="64" y="140">水辺（川）・夕空・星空・夜明け・日記の5つの画面。拾った言葉の保存</text>
<text x="64" y="170">今日：流れた記録・言葉の表・その人向けの川（好みの量・見つける枠・拾いやすくする時間）</text>
<text x="64" y="200">今日：設計書「その人向けの川」（AI の言葉・名札・自分の言葉で出る など）</text>
<text x="64" y="230" fill="#777">PR #15 がマージ待ち</text>
<rect x="40" y="270" width="920" height="150" rx="18" fill="#fdf1e0"/>
<text x="64" y="306" font-size="23" fill="#a60">▶ いま：使って確かめる（数週間）</text>
<text x="64" y="340">ふだんどおり毎日ひらく → 本物の記録がたまる</text>
<text x="64" y="370">川があなた向けになるか／夜明けが源を見つけるか／数字（4倍・2個・90秒）の見直し</text>
<text x="64" y="400">並行して：AI の鍵と月の上限を用意</text>
<rect x="40" y="440" width="920" height="150" rx="18" fill="#e6f0fa"/>
<text x="64" y="476" font-size="23" fill="#246">次：AI につなぐ（約1〜2週間）</text>
<text x="64" y="510">近い言葉・抽象的に近い言葉を作って流す／自分の言葉で出る（星空・夜明けに細かい言葉）</text>
<text x="64" y="540">夕空の大きさを割合に／夜明けに共通点の問い（〜かも？）</text>
<text x="64" y="570" fill="#777">ここまでで「好奇心の源に気づき、育つのが見える」がひととおりそろう</text>
<rect x="40" y="610" width="920" height="130" rx="18" fill="#f0eaf7"/>
<text x="64" y="646" font-size="23" fill="#649">そのあと：製品にする（約1か月）</text>
<text x="64" y="680">アイコン・はじめの案内・設定（データの書き出しと削除）・プライバシーポリシー</text>
<text x="64" y="710">知り合い数人に使ってもらう（1〜2週間）→ ストアに出す</text>
<rect x="40" y="760" width="920" height="110" rx="18" fill="#f2f2f2"/>
<text x="64" y="796" font-size="23" fill="#555">出したあと：育てる</text>
<text x="64" y="830">過去の自分から流れてくる泡（軸）・季節の言葉・島（使い道を決めてから）など</text>
</g>
</svg>
