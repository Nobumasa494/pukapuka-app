<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" font-family="Noto Sans CJK JP, sans-serif">
<rect width="1000" height="720" fill="#fbf8f2"/>
<text x="500" y="44" text-anchor="middle" font-size="26" fill="#223">全体のしくみ（4つの段だけ）</text>
<g font-size="20" fill="#334">
<rect x="60" y="80" width="880" height="120" rx="18" fill="#e6f0fa"/>
<text x="90" y="118" font-size="23" fill="#246">1. 川（流す）</text>
<text x="90" y="152">好きな家族の、いろいろな言葉が流れる ＋ 見つける枠（ランダム）</text>
<text x="90" y="182" fill="#a33">きまり：量だけで変える。「何のあとに何」は出さない</text>
<rect x="60" y="220" width="880" height="100" rx="18" fill="#fdf1e0"/>
<text x="90" y="258" font-size="23" fill="#246">2. 記録（残す）</text>
<text x="90" y="292">拾った言葉（番号・枠）／ 流れた回数（1日1行）／ 言葉の表（ラベル）</text>
<rect x="60" y="340" width="880" height="120" rx="18" fill="#eaf5ec"/>
<text x="90" y="378" font-size="23" fill="#246">3. 数える前にそろえる</text>
<text x="90" y="412">記録の少ない細かい言葉 → 元の言葉にまとめる（夜の散歩 → 散歩）</text>
<text x="90" y="442">記録がたまった細かい言葉 → 自分の言葉で出る（夜の散歩のまま）</text>
<rect x="60" y="480" width="880" height="120" rx="18" fill="#f0eaf7"/>
<text x="90" y="518" font-size="23" fill="#246">4. いつもの分析（今まで決めたまま）</text>
<text x="90" y="552">夕空（割合で大きさ）／ 星空（同じ日に一緒）／ 夜明け（次の日に元気）</text>
<text x="90" y="582" fill="#555">→ 3. でそろえた言葉を入れるだけ。計算そのものは変えない</text>
</g>
<g stroke="#556" stroke-width="3" marker-end="url(#a)"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#556"/></marker></defs>
<line x1="500" y1="200" x2="500" y2="218"/><line x1="500" y1="320" x2="500" y2="338"/><line x1="500" y1="460" x2="500" y2="478"/></g>
<text x="60" y="650" font-size="20" fill="#2a7">新しく増えるのは 1〜3 だけ。4（分析）は、そろえた言葉を受け取るだけで、中身は同じ。</text>
<text x="60" y="684" font-size="20" fill="#2a7">確かめ済み：1 のきまりなら 4 はだまされない。まだ：3 の「自分の言葉で出る」の数字。</text>
</svg>
