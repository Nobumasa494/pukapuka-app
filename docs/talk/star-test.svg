<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1010" font-family="Noto Sans CJK JP, sans-serif">
<rect width="1000" height="1010" fill="#fbf8f2"/>
<text x="500" y="46" text-anchor="middle" font-size="28" fill="#223" font-weight="bold">星空の線は、こうして決まる</text>
<text x="500" y="80" text-anchor="middle" font-size="19" fill="#556">「同じ日に、一緒に拾われた」ことが、偶然かどうかを調べる</text>
<text x="40" y="132" font-size="23" fill="#246" font-weight="bold">① 5日間に拾った名札</text>
<text x="225" y="170" text-anchor="middle" font-size="19" fill="#556">月</text>
<text x="295" y="170" text-anchor="middle" font-size="19" fill="#556">火</text>
<text x="365" y="170" text-anchor="middle" font-size="19" fill="#556">水</text>
<text x="435" y="170" text-anchor="middle" font-size="19" fill="#556">木</text>
<text x="505" y="170" text-anchor="middle" font-size="19" fill="#556">金</text>
<text x="150" y="215" text-anchor="end" font-size="21" fill="#223">散歩</text>
<rect x="200" y="185" width="50" height="40" rx="8" fill="#e9a23b" stroke="#ccc"/>
<rect x="270" y="185" width="50" height="40" rx="8" fill="#e9a23b" stroke="#ccc"/>
