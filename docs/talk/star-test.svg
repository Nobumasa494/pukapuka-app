<rect x="873" y="508" width="26" height="36" rx="5" fill="#4a8fd0" stroke="#ccc"/>
<rect x="904" y="508" width="26" height="36" rx="5" fill="#4a8fd0" stroke="#ccc"/>
<text x="40" y="582" font-size="19" fill="#556">（散歩は 月・火・木 の3日で固定）</text>
<text x="40" y="622" font-size="22" fill="#223">散歩と同じ3日になるのは、10通りのうち <tspan fill="#c0392b" font-weight="bold">1通り</tspan>（赤い枠）</text>
<text x="40" y="660" font-size="22" fill="#223">→ 偶然でも起きる確率は <tspan fill="#c0392b" font-weight="bold">10%</tspan></text>
<rect x="40" y="680" width="920" height="46" rx="10" fill="#f1efe9"/>
<text x="500" y="711" text-anchor="middle" font-size="21" fill="#223">ふつうは1%より小さくないと線にしない → <tspan font-weight="bold">5日では、線にならない</tspan></text>
<line x1="40" y1="752" x2="960" y2="752" stroke="#ddd"/>
<text x="40" y="792" font-size="23" fill="#246" font-weight="bold">③ 30日たつと</text>
<text x="40" y="830" font-size="21" fill="#223">散歩の日 10日、音楽の日 10日、そのうち <tspan font-weight="bold">9日が同じ日</tspan></text>
<text x="40" y="868" font-size="21" fill="#223">→ 偶然でも起きる確率は <tspan fill="#2e8b57" font-weight="bold">約 0.0007%</tspan>（15万回に1回）</text>
<rect x="40" y="890" width="920" height="46" rx="10" fill="#e8f5ec"/>
<text x="500" y="921" text-anchor="middle" font-size="21" fill="#223">1%よりずっと小さい → <tspan font-weight="bold">散歩と音楽の間に、線を引く</tspan></text>
<text x="500" y="975" text-anchor="middle" font-size="19" fill="#556">星空は、この判定を通った組だけを、つながりの強い順に出す</text>
</svg>