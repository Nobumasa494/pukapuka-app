<rect x="626" y="450" width="26" height="36" rx="5" fill="#fff" stroke="#ccc"/>
<rect x="657" y="450" width="26" height="36" rx="5" fill="#4a8fd0" stroke="#ccc"/>
<rect x="688" y="450" width="26" height="36" rx="5" fill="#4a8fd0" stroke="#ccc"/>
<rect x="719" y="450" width="26" height="36" rx="5" fill="#fff" stroke="#ccc"/>
