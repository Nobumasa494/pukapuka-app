<rect x="480" y="185" width="50" height="40" rx="8" fill="#fff" stroke="#ccc"/>
<text x="150" y="263" text-anchor="end" font-size="21" fill="#223">音楽</text>
<rect x="200" y="233" width="50" height="40" rx="8" fill="#4a8fd0" stroke="#ccc"/>
<rect x="270" y="233" width="50" height="40" rx="8" fill="#4a8fd0" stroke="#ccc"/>
<rect x="340" y="233" width="50" height="40" rx="8" fill="#fff" stroke="#ccc"/>
<rect x="410" y="233" width="50" height="40" rx="8" fill="#4a8fd0" stroke="#ccc"/>
<rect x="480" y="233" width="50" height="40" rx="8" fill="#fff" stroke="#ccc"/>
<text x="150" y="311" text-anchor="end" font-size="21" fill="#223">料理</text>
<rect x="200" y="281" width="50" height="40" rx="8" fill="#fff" stroke="#ccc"/>
<rect x="270" y="281" width="50" height="40" rx="8" fill="#fff" stroke="#ccc"/>
<rect x="340" y="281" width="50" height="40" rx="8" fill="#999" stroke="#ccc"/>
<rect x="410" y="281" width="50" height="40" rx="8" fill="#fff" stroke="#ccc"/>
<rect x="480" y="281" width="50" height="40" rx="8" fill="#999" stroke="#ccc"/>
<text x="590" y="225" font-size="21" fill="#223">散歩の日は3日、音楽の日も3日。</text>
<text x="590" y="258" font-size="21" fill="#c0392b" font-weight="bold">3日とも、同じ日。</text>
<text x="590" y="296" font-size="19" fill="#556">「すごく強いつながり？」</text>
<line x1="40" y1="352" x2="960" y2="352" stroke="#ddd"/>
<text x="40" y="392" font-size="23" fill="#246" font-weight="bold">② 偶然でも、こんなに重なる？ を調べる</text>
<text x="40" y="428" font-size="20" fill="#223">音楽の3日を、5日のどこかに、でたらめに置いてみる → 置き方は10通り</text>
<rect x="40" y="450" width="26" height="36" rx="5" fill="#4a8fd0" stroke="#ccc"/>
