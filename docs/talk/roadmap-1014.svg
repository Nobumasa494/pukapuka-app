<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1225" font-family="Noto Sans CJK JP, sans-serif"><rect width="1000" height="1225" fill="#fbf8f2"/>
<text x="500" y="46" text-anchor="middle" font-size="28" font-weight="bold" fill="#223">これからの流れ</text>
<text x="500" y="80" text-anchor="middle" font-size="17" fill="#556">★＝あなたの出番</text>
<text x="40" y="133" font-size="23" font-weight="bold" fill="#c0392b">いま：作る</text>
<rect x="40" y="150" width="920" height="78" rx="14" fill="#fff" stroke="#c0392b" stroke-width="2"/>
<circle cx="80" cy="189" r="22" fill="#c0392b"/><text x="80" y="196" text-anchor="middle" font-size="20" font-weight="bold" fill="#fff">1</text>
<text x="120" y="182" font-size="19" font-weight="bold" fill="#223">入れ物を用意する</text><text x="120" y="210" font-size="15" fill="#556">言葉の表に「箱の番号」「意味の位置」の欄を足す</text>
<rect x="40" y="240" width="920" height="78" rx="14" fill="#fff" stroke="#c0392b" stroke-width="2"/>
<circle cx="80" cy="279" r="22" fill="#c0392b"/><text x="80" y="286" text-anchor="middle" font-size="20" font-weight="bold" fill="#fff">2</text>
<text x="120" y="272" font-size="19" font-weight="bold" fill="#223">倉庫をつくる</text><text x="120" y="300" font-size="15" fill="#556">45個の箱ごとに100語。意味の位置と箱の番号を付ける</text>
<text x="940" y="286" text-anchor="end" font-size="16" font-weight="bold" fill="#e08a1e">★ 一覧を見て、ダメな言葉を消す</text>
<rect x="40" y="330" width="920" height="78" rx="14" fill="#fff" stroke="#c0392b" stroke-width="2"/>
<circle cx="80" cy="369" r="22" fill="#c0392b"/><text x="80" y="376" text-anchor="middle" font-size="20" font-weight="bold" fill="#fff">3</text>
<text x="120" y="362" font-size="19" font-weight="bold" fill="#223">水辺を直す</text><text x="120" y="390" font-size="15" fill="#556">古い言葉を休ませる。配合4・3・3、泡は2行</text>
<text x="940" y="376" text-anchor="end" font-size="16" font-weight="bold" fill="#e08a1e">★ スマホで触る</text>
<rect x="40" y="420" width="920" height="78" rx="14" fill="#fff" stroke="#c0392b" stroke-width="2"/>
<circle cx="80" cy="459" r="22" fill="#c0392b"/><text x="80" y="466" text-anchor="middle" font-size="20" font-weight="bold" fill="#fff">4</text>
<text x="120" y="452" font-size="19" font-weight="bold" fill="#223">星空・夜明け・夕空を箱で数える</text><text x="120" y="480" font-size="15" fill="#556">夕空は7グループと色。夜明けの文</text>
<text x="940" y="466" text-anchor="end" font-size="16" font-weight="bold" fill="#e08a1e">★ スマホで見る</text>
<rect x="40" y="510" width="920" height="78" rx="14" fill="#fff" stroke="#c0392b" stroke-width="2"/>
<circle cx="80" cy="549" r="22" fill="#c0392b"/><text x="80" y="556" text-anchor="middle" font-size="20" font-weight="bold" fill="#fff">5</text>
<text x="120" y="542" font-size="19" font-weight="bold" fill="#223">片付けて、コミット・PR</text><text x="120" y="570" font-size="15" fill="#556">試しの表などを消す</text>
<text x="940" y="556" text-anchor="end" font-size="16" font-weight="bold" fill="#e08a1e">★ OK を出す</text>
<text x="40" y="643" font-size="23" font-weight="bold" fill="#2e8b57">そのあと：使う（数週間）</text>
<rect x="40" y="660" width="920" height="78" rx="14" fill="#fff" stroke="#2e8b57" stroke-width="2"/>
<circle cx="80" cy="699" r="22" fill="#2e8b57"/><text x="80" y="706" text-anchor="middle" font-size="20" font-weight="bold" fill="#fff">6</text>
<text x="120" y="692" font-size="19" font-weight="bold" fill="#223">家族・友達と使う</text><text x="120" y="720" font-size="15" fill="#556">記録がたまる</text>
<text x="940" y="706" text-anchor="end" font-size="16" font-weight="bold" fill="#e08a1e">★ ふだんどおり使う</text>
<rect x="40" y="750" width="920" height="78" rx="14" fill="#fff" stroke="#2e8b57" stroke-width="2"/>
<circle cx="80" cy="789" r="22" fill="#2e8b57"/><text x="80" y="796" text-anchor="middle" font-size="20" font-weight="bold" fill="#fff">7</text>
<text x="120" y="782" font-size="19" font-weight="bold" fill="#223">記録で確かめる</text><text x="120" y="810" font-size="15" fill="#556">同じ言葉が何日で戻るか・誰も拾わない箱・星空と夜明けの出方</text>
<text x="40" y="883" font-size="23" font-weight="bold" fill="#4a8fd0">人が増えてきたら</text>
<rect x="40" y="900" width="920" height="78" rx="14" fill="#fff" stroke="#4a8fd0" stroke-width="2"/>
<circle cx="80" cy="939" r="22" fill="#4a8fd0"/><text x="80" y="946" text-anchor="middle" font-size="20" font-weight="bold" fill="#fff">8</text>
<text x="120" y="932" font-size="19" font-weight="bold" fill="#223">庭師を動かす</text><text x="120" y="960" font-size="15" fill="#556">週1回、よく拾われる箱を育てる（200語まで）→ 入れかえ</text>
<rect x="40" y="990" width="920" height="78" rx="14" fill="#fff" stroke="#4a8fd0" stroke-width="2"/>
<circle cx="80" cy="1029" r="22" fill="#4a8fd0"/><text x="80" y="1036" text-anchor="middle" font-size="20" font-weight="bold" fill="#fff">9</text>
<text x="120" y="1022" font-size="19" font-weight="bold" fill="#223">言葉ごとの合計の表・読みこみを軽く</text><text x="120" y="1050" font-size="15" fill="#556">人が増えても重くならないように</text>
<rect x="40" y="1080" width="920" height="78" rx="14" fill="#fff" stroke="#4a8fd0" stroke-width="2"/>
<circle cx="80" cy="1119" r="22" fill="#4a8fd0"/><text x="80" y="1126" text-anchor="middle" font-size="20" font-weight="bold" fill="#fff">10</text>
<text x="120" y="1112" font-size="19" font-weight="bold" fill="#223">カードソートで箱を確かめる</text><text x="120" y="1140" font-size="15" fill="#556">人の分け方と、箱の分け方がそろうか</text>
<text x="940" y="1126" text-anchor="end" font-size="16" font-weight="bold" fill="#e08a1e">★ 家族・友達に頼む</text>
<text x="500" y="1195" text-anchor="middle" font-size="17" fill="#556">製品にする前に：Gemini の有料プランと上限・公式の料金を確かめる</text>
</svg>